name: ai-interview

# Local development only. The database password comes from POSTGRES_PASSWORD in a root .env (gitignored; copy
# .env.example). Postgres applies it when the pgdata volume is first created.
x-api-env: &api-env
  RAILS_ENV: development
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USERNAME: postgres
  DB_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
  REDIS_URL: redis://redis:6379/1
  WEB_CONCURRENCY: "0"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432" # this machine only, not the local network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379" # Redis has no password
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    image: ai-interview-api-dev
    environment: *api-env
    command: >
      bash -c "test -f config/application.yml || { echo 'Missing api/config/application.yml - copy it from config/application.yml.sample'; exit 1; };
      mkdir -p tmp/pids && rm -f tmp/pids/server.pid &&
      bundle exec rails db:create db:migrate db:seed &&
      bundle exec puma -C config/puma.rb"
    ports:
      - "3001:3001"
    volumes:
      - ./api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sidekiq:
    image: ai-interview-api-dev
    pull_policy: never
    environment: *api-env
    command: bundle exec sidekiq -r ./config/environment.rb -C config/sidekiq.yml
    volumes:
      - ./api:/app
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: http://localhost:3001/api/v1
      VITE_WS_BASE_URL: ws://localhost:3001
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
